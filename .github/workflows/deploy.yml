name: Build and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: edumind-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runner ARM nativo (gratuito em repositório público): a VM de produção é Ampere A1 (arm64) e a imagem é gerada
    # sem emulação (como no FinMind).
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/edumind-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/edumind-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # "git checkout -- scripts/" descarta mudança local nos scripts (ex.: chmod +x), que faria o pull abortar.
      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: false
          command_timeout: 30m
          script: |
            echo "${{ secrets.GHCR_PAT }}" | sudo -iu deploy bash -lc 'cd /opt/apps/edumind/app && git checkout -- scripts/ && git pull --ff-only && chmod +x scripts/deploy.sh && bash scripts/github-deploy.sh "${{ secrets.GHCR_USERNAME }}"'
