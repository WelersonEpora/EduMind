name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Os testes usam um PostgreSQL de verdade (edumind_test), migrado pelo "pretest".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edumind
          POSTGRES_PASSWORD: edumind
          POSTGRES_DB: edumind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumind -d edumind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: edumind_test
      POSTGRES_DATABASE_TEST: edumind_test
      POSTGRES_USER: edumind
      POSTGRES_PASSWORD: edumind
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
