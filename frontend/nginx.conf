server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDFs de edital e de prova vão até 50 MB (multer, backend/src/routes/*.routes.js). O padrão do nginx é 1 MB.
    client_max_body_size 51m;

    # DNS embutido do Docker: o backend é resolvido a cada requisição, e o nginx sobe mesmo antes dele.
    resolver 127.0.0.11 valid=10s;

    # Vue Router em History Mode: qualquer rota que não seja um arquivo estático cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca vem do cache sem revalidar (senão, depois de um deploy, o navegador abre a versão velha).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mesma origem do frontend, sem CORS: a sessão é um cookie de mesma origem.
    # A busca da URL oficial de uma norma (IA com busca na web) leva até 180 s: tempo de espera folgado.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
    }
}
